name: Windows release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: p4_table.bin
          key: p4table-v1
      - name: Materialise solver table
        shell: pwsh
        run: |
          if ((Get-Item p4_table.bin).Length -lt 100000000) { git lfs pull --include='p4_table.bin' }
          if ((Get-Item p4_table.bin).Length -lt 100000000) { throw 'Missing LFS solver table' }
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          architecture: x64
          cache: pip
      - name: Install build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.22.0
      - name: Check tag and version
        id: version
        shell: pwsh
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          $releaseVersion = python -c 'from app.constants import APP_VERSION; print(APP_VERSION)'
          if ($env:RELEASE_TAG -ne "v$releaseVersion") { throw 'Tag differs from app version' }
          "version=$releaseVersion" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and verify Windows portable package
        run: python scripts/build_windows.py
      - uses: actions/upload-artifact@v4
        with:
          name: CubeSolver-Windows-${{ steps.version.outputs.version }}
          path: |
            bin/*-windows-x64.zip
            bin/*-windows-x64.json
            bin/*-windows-x64.sha256
      - name: Publish Windows release
        uses: softprops/action-gh-release@v3
        with:
          body_path: docs/release-${{ steps.version.outputs.version }}.md
          make_latest: true
          files: |
            bin/*-windows-x64.zip
            bin/*-windows-x64.json
            bin/*-windows-x64.sha256
